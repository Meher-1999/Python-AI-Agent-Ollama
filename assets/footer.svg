<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120"
     fill="none" preserveAspectRatio="none" role="img" aria-label="">
  <defs>
    <linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e14b9c"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#5b6cff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Back wave -->
  <path fill="url(#f)" fill-opacity="0.35"
        d="M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 L1200,120 L0,120 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 L1200,120 L0,120 Z;
              M0,70 C200,110 400,30 600,70 C800,110 1000,30 1200,70 L1200,120 L0,120 Z;
              M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 L1200,120 L0,120 Z"/>
  </path>

  <!-- Front wave -->
  <path fill="url(#f)"
        d="M0,85 C250,55 450,115 600,85 C780,55 980,115 1200,85 L1200,120 L0,120 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,85 C250,55 450,115 600,85 C780,55 980,115 1200,85 L1200,120 L0,120 Z;
              M0,85 C250,115 450,55 600,85 C780,115 980,55 1200,85 L1200,120 L0,120 Z;
              M0,85 C250,55 450,115 600,85 C780,55 980,115 1200,85 L1200,120 L0,120 Z"/>
  </path>
</svg>
